name: Feature request
description: Suggest an improvement to RepoDoctor
title: "[Feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or opportunity
      description: What problem should this feature solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe your idea.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional alternative approaches.
    validations:
      required: false
